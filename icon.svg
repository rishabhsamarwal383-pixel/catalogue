<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B18"/>
      <stop offset="100%" stop-color="#0D0B0A"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Outer subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#D97706" stroke-width="4" stroke-opacity="0.25"/>

  <!-- 3D Isometric Cardboard Box Icon -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <polygon points="0,-110 130,-35 0,40 -130,-35" fill="#EAB308" opacity="0.95"/>
    <polygon points="-25,-95 25,-66 0,-51 -50,-80" fill="url(#tape)" opacity="0.8"/>

    <!-- Left Face -->
    <polygon points="-130,-35 0,40 0,170 -130,95" fill="url(#kraft)"/>
    
    <!-- Right Face -->
    <polygon points="0,40 130,-35 130,95 0,170" fill="#92400E"/>

    <!-- Sealing Tape along center seam -->
    <polygon points="-18,-98 18,-78 0,-68 -36,-88" fill="#FDE68A"/>
    <line x1="0" y1="40" x2="0" y2="170" stroke="#78350F" stroke-width="3"/>
  </g>

  <!-- Brand Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOX CO.</text>
  <text x="256" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="3">UDAIPUR</text>
</svg>
